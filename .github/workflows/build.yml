name: Build Antitoques Fantasma APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: python3 -m zipfile -e antitoques-fantasma-source.zip .
      - name: Fix Kotlin compilation issues in source ZIP
        run: |
          sed -i 's|import androidx.compose.foundation.shape.RectangleShape|import androidx.compose.ui.graphics.RectangleShape|' scratch/antitoques-fantasma/app/src/main/java/com/zapia/antitoques/MainActivity.kt
          sed -i 's/private val expireOverlay=Runnable{/private val expireOverlay: Runnable = Runnable{/' scratch/antitoques-fantasma/app/src/main/java/com/zapia/antitoques/GhostTouchAccessibilityService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: scratch/antitoques-fantasma
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: antitoques-fantasma-debug-apk
          path: scratch/antitoques-fantasma/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
